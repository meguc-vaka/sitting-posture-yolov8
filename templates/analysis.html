<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>AI 坐姿即時監測 - 數據分析</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- 引入 Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1e2430 0%, #0f1319 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Helvetica Neue', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }
        header, .navbar {
            background-color: rgba(30, 40, 55, 0.7) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }
        .nav-link, .member-link, header h4, .dropdown-toggle {
            color: #ecf0f1 !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #3b82f6 !important; }
        
        .main-container { flex: 1; padding: 40px 0; }
        .record-card {
            background-color: rgba(30, 40, 55, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        
        /* 圖表的響應式容器 */
        .chart-container {
            position: relative;
            height: 60vh;
            width: 100%;
        }

        #footer {
            text-align: center; color: #64748b; padding: 20px 0; font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: auto;
        }

        /* --- 手機適配 --- */
        @media (max-width: 767.98px) {
            .record-card { padding: 20px 16px; }
            .record-card h3 { font-size: 1.2rem; }
            .chart-container { height: 40vh; }
            .login-box { margin-right: 0.5rem !important; }
            .member-link { font-size: 0.85rem; }
            #aboutwe { font-size: 0.75rem; padding: 0.1rem 0.5rem; }
            #footer { font-size: 0.8rem; padding: 14px 0; }
        }
    </style>
</head>
<body>

<!-- 頂部導覽列 (與其他頁面保持一致) -->
<header class="container-fluid border-bottom">
    <div class="row align-items-center py-2">
        <div class="col-6 col-md-4 ps-4">
            <h4 class="mb-0"><span class="logo-text">Logo</span> 骨架偵測</h4>
        </div>
        <div class="col-6 col-md-8 d-flex justify-content-end align-items-center pe-4">
            <div class="login-box me-4">
            <!-- 修正 1：去 session 裡面檢查 loggedIn 狀態 -->
            {% if not session.get('loggedIn') %}
                <a href="/loginForm" class="member-link text-decoration-none">會員登入</a>
            {% else %}
                <div class="dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <!-- 修正 2：去 session 裡面抓取名字 -->
                        Hello, {{ session.get('firstName') }}
                    </a>
                    <ul class="dropdown-menu shadow">
                        <li><a class="dropdown-item" href="/renaissance">記錄管理</a></li>
                        <li><a class="dropdown-item" href="#">個人檔案</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <!-- 修正 3：綁定我們剛剛寫好的 /logout 路由 -->
                        <li><a class="dropdown-item" href="/logout">登出</a></li>
                    </ul>
                </div>
            {% endif %}
            </div>

            <div class="d-none d-md-flex align-items-center me-3">
                <a id="aboutwe" class="btn btn-outline-light btn-sm" href="/aboutus">關於我們</a>
                <i class="bi bi-globe2 ms-2 text-light"></i>
            </div>
            <form class="d-none d-md-flex search-form align-items-center" action="/search" method="get">
                <div class="input-group input-group-sm">
                    <input type="search" name="searchQuery" class="form-control" placeholder="Please search...">
                    <button class="btn btn-outline-secondary p-0 ms-2 border-0" type="submit">
                        <i class="bi bi-search text-primary"></i>
                    </button>
                </div>
            </form>
        </div>  
    </div>      
</header>

<nav class="navbar navbar-expand-sm navbar-dark shadow-sm">
    <div class="container-fluid p-0">
        <button class="navbar-toggler ms-3 my-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu-analysis" aria-controls="nav-menu-analysis" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-start" id="nav-menu-analysis">
            <ul class="navbar-nav ps-4">
                <li class="nav-item"><a href="/" class="nav-link">首頁</a></li>
                <li class="nav-item"><a href="/ScanPage" class="nav-link">骨架偵測</a></li>
                {% if session.role == 'admin' %}
                <li class="nav-item">
                    <a href="/renaissance" class="nav-link">姿勢紀錄</a>
                </li>
                {% endif %}
                <li class="nav-item"><a href="/analysis" class="nav-link active" style="color: #3b82f6 !important;">數據分析</a></li>
                <li class="nav-item"><a href="/rank" class="nav-link">高風險姿勢排行</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- 主內容區塊 -->
<div class="main-container container-fluid px-4 px-md-5">
    <div class="row g-4">
        <!-- 左側：折線圖 -->
        <div class="col-12 col-lg-8">
            <div class="record-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0 fw-bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">姿勢趨勢變化圖</h3>
                </div>
                <div class="chart-container">
                    <canvas id="postureChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 右側：圓餅圖 -->
        <div class="col-12 col-lg-4">
            <div class="record-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0 fw-bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">整體姿勢佔比</h3>
                </div>

                <div class="chart-container" style="height: 45vh;">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<footer id="footer">
    <p class="mb-0">&copy; 最終解釋權與所有權歸製作者所有</p>
</footer>

<!-- 載入 Bootstrap 互動效果 (Dropdown 需要) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 驅動圖表的 JavaScript -->
<script>
    Chart.defaults.color = '#ecf0f1';
    Chart.defaults.font.family = "'Helvetica Neue', 'Segoe UI', sans-serif";
    // 接收來自 Flask 的數據，加上 safe 確保引號不會被轉義
    const chartData = {{ chart_data | tojson | safe }};

    // 折線圖
    const ctx = document.getElementById('postureChart').getContext('2d');
    const postureChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartData.labels, // X 軸：時間
            datasets: [
                {
                    label: '端正坐姿 (幀)',
                    data: chartData.good,
                    borderColor: '#2ecc71', // 綠色
                    backgroundColor: 'rgba(46, 204, 113, 0.1)',
                    borderWidth: 2,
                    tension: 0.4, // 滑順曲線
                    fill: true
                },
                {
                    label: '烏龜頸 (幀)',
                    data: chartData.turtle,
                    borderColor: '#e74c3c', // 紅色
                    backgroundColor: 'rgba(231, 76, 60, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                },
                {
                    label: '過度低頭 (幀)',
                    data: chartData.down,
                    borderColor: '#f39c12', // 橘黃色
                    backgroundColor: 'rgba(243, 156, 18, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                },
                {
                    label: '癱坐前滑 (幀)',
                    data: chartData.slouch,
                    borderColor: '#9b59b6', // 紫色
                    backgroundColor: 'rgba(155, 89, 182, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top' },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    backgroundColor: 'rgba(30, 40, 55, 0.9)',
                    titleColor: '#fff',
                    bodyColor: '#ccc',
                    borderColor: 'rgba(255,255,255,0.1)',
                    borderWidth: 1
                }
            },
            scales: {
                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(255, 255, 255, 0.05)' }
                }
            }
        }
    }
    );

    // 圓餅圖
    const pieCtx = document.getElementById('pieChart').getContext('2d');
    const pieChart = new Chart(pieCtx, {
        type: 'pie',
        data: {
            labels: ['端正坐姿', '烏龜頸', '過度低頭', '癱坐前滑'],
            datasets: [{
                // 讀取我們剛剛在後端加總好的 pie_totals 陣列
                data: chartData.pie_totals,
                backgroundColor: [
                    'rgba(46, 204, 113, 0.8)',  // 綠色
                    'rgba(231, 76, 60, 0.8)',   // 紅色
                    'rgba(243, 156, 18, 0.8)',  // 橘黃色
                    'rgba(155, 89, 182, 0.8)'   // 紫色
                ],
                borderColor: [
                    '#2ecc71', '#e74c3c', '#f39c12', '#9b59b6'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom', // 標籤放在圖表下方
                    labels: {
                        color: '#ecf0f1',
                        padding: 20
                    }
                }
            }
        }
    });
</script>
</body>
</html>
