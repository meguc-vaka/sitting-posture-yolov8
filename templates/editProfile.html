<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>AI 坐姿即時監測 - 編輯資料</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}" />

    <style>
        body {
            background: linear-gradient(135deg, #1e2430 0%, #0f1319 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Helvetica Neue', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header, .navbar {
            background-color: rgba(30, 40, 55, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .nav-link, .member-link, header h4, .dropdown-toggle {
            color: #ecf0f1 !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .member-link:hover, .dropdown-toggle:hover {
            color: #3b82f6 !important;
        }

        .dropdown-menu {
            background-color: rgba(30, 40, 55, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dropdown-item { color: #ecf0f1; }
        .dropdown-item:hover { background-color: #2c3e50; color: white; }
        .dropdown-divider { border-top: 1px solid rgba(255, 255, 255, 0.1); }

        .search-form input {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .search-form input:focus {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .search-form input::placeholder { color: #8c98a4; }

        .main-container {
            flex: 1;
            padding: 40px 0;
        }

        .edit-card {
            background-color: rgba(30, 40, 55, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .edit-card h2 {
            font-weight: 600;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .edit-card hr {
            border-color: rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
        }

        .edit-card label {
            color: #a0aec0;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .edit-card input[type="text"],
        .edit-card input[type="email"] {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .edit-card input:focus {
            background-color: rgba(0, 0, 0, 0.5);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .edit-card input[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .edit-card input::placeholder { color: #8c98a4; }

        .btn-save {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-save:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-back {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ecf0f1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        #footer {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        @media (max-width: 767.98px) {
            .main-container { padding: 20px 0; }
            .edit-card { padding: 24px 20px; border-radius: 12px; }
            .edit-card h2 { font-size: 1.4rem; }
            .edit-card input[type="text"],
            .edit-card input[type="email"] { padding: 10px 14px; font-size: 15px; margin-bottom: 14px; }
            .btn-save, .btn-back { font-size: 15px; padding: 10px; }
            .login-box { margin-right: 0.5rem !important; }
            .member-link { font-size: 0.85rem; }
            #aboutwe { font-size: 0.75rem; padding: 0.1rem 0.5rem; }
            #footer { font-size: 0.8rem; padding: 14px 0; }
        }
    </style>
</head>

<body>

<header class="container-fluid border-bottom">
    <div class="row align-items-center py-2">
        <div class="col-6 col-md-4 ps-4">
            <h4 class="mb-0"><span class="logo-text">Logo</span> 骨架偵測</h4>
        </div>
        <div class="col-6 col-md-8 d-flex justify-content-end align-items-center pe-4">
            <div class="login-box me-4">
                {% if not session.get('loggedIn') %}
                    <a href="/loginForm" class="member-link text-decoration-none">會員登入</a>
                {% else %}
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Hello, {{ session.get('firstName') }}
                        </a>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-item" href="/profileHome">個人檔案</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">登出</a></li>
                        </ul>
                    </div>
                {% endif %}
            </div>
            <div class="d-none d-md-flex align-items-center me-3">
                <a id="aboutwe" class="btn btn-outline-light btn-sm" href="/aboutus">關於我們</a>
                <i class="bi bi-globe2 ms-2 text-light"></i>
            </div>
            <form class="d-none d-md-flex search-form align-items-center" action="/search" method="get">
                <div class="input-group input-group-sm">
                    <input type="search" name="searchQuery" class="form-control" placeholder="Please search...">
                    <button class="btn btn-outline-secondary p-0 ms-2 border-0" type="submit">
                        <i class="bi bi-search text-primary"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</header>

<nav class="navbar navbar-expand-sm navbar-dark shadow-sm">
    <div class="container-fluid p-0">
        <button class="navbar-toggler ms-3 my-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu-edit" aria-controls="nav-menu-edit" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-start" id="nav-menu-edit">
            <ul class="navbar-nav ps-4">
                <li class="nav-item"><a href="/" class="nav-link">首頁</a></li>
                <li class="nav-item"><a href="/ScanPage" class="nav-link">骨架偵測</a></li>
                {% if session.role == 'admin' %}
                <li class="nav-item"><a href="/renaissance" class="nav-link">姿勢紀錄</a></li>
                <li class="nav-item"><a href="/analysis" class="nav-link">數據分析</a></li>
                {% endif %}
                <li class="nav-item"><a href="/rank" class="nav-link">高風險姿勢排行</a></li>
            </ul>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="main-container container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="edit-card">
                <h2 class="text-center">編輯資料</h2>
                <hr>
                <form action="/updateProfile" method="POST">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ profileData[0] }}" readonly>

                    <label>名字</label>
                    <input type="text" name="firstName" value="{{ profileData[1] }}" placeholder="請輸入名字">

                    <label>姓氏</label>
                    <input type="text" name="lastName" value="{{ profileData[2] }}" placeholder="請輸入姓氏">

                    <label>地址</label>
                    <input type="text" name="address1" value="{{ profileData[3] }}" placeholder="請輸入地址">

                    <label>電話號碼</label>
                    <input type="text" name="phone" value="{{ profileData[4] }}" placeholder="請輸入電話號碼">

                    <label>體重 (kg)</label>
                    <input type="text" name="weight" value="{{ profileData[5] }}" placeholder="請輸入體重">

                    <label>身高 (cm)</label>
                    <input type="text" name="height" value="{{ profileData[6] }}" placeholder="請輸入身高">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn-save">儲存修改</button>
                        <a href="{{ url_for('profileHome') }}" class="btn-back">返回個人檔案</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer id="footer">
    <p class="mb-0">&copy; 最終解釋權與所有權歸製作者所有</p>
</footer>

</body>
</html>
