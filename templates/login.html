<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>AI 坐姿即時監測 - 會員登入</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        
        body {
            background: linear-gradient(135deg, #1e2430 0%, #0f1319 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Helvetica Neue', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header, .navbar {
            background-color: rgba(30, 40, 55, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .nav-link, .member-link, header h4, .dropdown-toggle {
            color: #ecf0f1 !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .member-link:hover, .dropdown-toggle:hover {
            color: #3b82f6 !important;
        }

        .dropdown-menu {
            background-color: rgba(30, 40, 55, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dropdown-item {
            color: #ecf0f1;
        }

        .dropdown-item:hover {
            background-color: #2c3e50;
            color: white;
        }
        
        .dropdown-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-form input {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .search-form input:focus {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .search-form input::placeholder {
            color: #8c98a4;
        }

        /* ----- 登入區塊 ----- */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .login-card {
            background-color: rgba(30, 40, 55, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        #UserLogInText {
            font-weight: 600;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        hr {
            border-color: rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
        }

        /* 輸入框 */
        #login input[type="text"], 
        #login input[type="password"] {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        #login input:focus {
            background-color: rgba(0, 0, 0, 0.5);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        #login input::placeholder {
            color: #8c98a4;
        }

        /* 登入按鈕 */
        #loginButton {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #loginButton:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
        }

        /* 註冊連結 */
        #login a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ecf0f1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        #login a:hover {
            color: #3b82f6;
        }

        /* 錯誤訊息 */
        .error-msg {
            color: #e74c3c;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        /* 左側圖片 */
        #remined {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            object-fit: cover;
        }

        /* 頁尾 */
        #footer {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

<header class="container-fluid border-bottom">
    <div class="row align-items-center py-2">
        <div class="col-4 ps-4">
            <h4 class="mb-0"><span class="logo-text">Logo</span> 骨架偵測</h4>
        </div>

        <div class="col-8 d-flex justify-content-end align-items-center pe-4">
            
            <div class="login-box me-4">
                {% if not loggedIn %}
                    <a href="/loginForm" class="member-link text-decoration-none">會員登入</a>
                {% else %}
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Hello, {{firstName}}
                        </a>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-item" href="/account/orders">記錄管理</a></li>
                            <li><a class="dropdown-item" href="/account/profile">個人檔案</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">登出</a></li>
                        </ul>
                    </div>
                {% endif %}
            </div>

            <div class="d-flex align-items-center me-3">
                <a id="aboutwe" class="btn btn-outline-light btn-sm" href="/aboutwe">關於我們</a>
                <i class="bi bi-globe2 ms-2 text-light"></i>
            </div>
                
            <form class="d-flex search-form align-items-center" action="/search" method="get">
                <div class="input-group input-group-sm">
                    <input type="search" name="searchQuery" class="form-control" placeholder="Please search...">
                    <button class="btn btn-outline-secondary p-0 ms-2 border-0" type="submit">
                        <i class="bi bi-search text-primary"></i>
                    </button>
                </div>
            </form>
        </div>  
    </div>      
</header>

<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container-fluid p-0">
        <div class="collapse navbar-collapse justify-content-start" id="nav-menu">
            <ul class="navbar-nav ps-4">
                <li class="nav-item"><a href="/" class="nav-link">首頁</a></li>
                <li class="nav-item"><a href="/rococo" class="nav-link">骨架偵測</a></li>
                <li class="nav-item"><a href="/renaissance" class="nav-link">姿勢紀錄</a></li>
            </ul>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 主內容區塊 -->
<div class="main-container container">
    <div class="row w-100 align-items-center justify-content-center">
        <!-- 左側圖片 -->
        <div class="col-md-6 mb-4 mb-md-0 pe-md-4">
            <img src="{{ url_for('static', filename='images/remined.png') }}" id="remined" alt="提醒圖片" />
        </div>
        
        <!-- 右側登入表單 -->
        <div class="col-md-5">
            <div class="login-card">
                <h2 id="UserLogInText" class="text-center">會員登入</h2>
                <hr>
                
                {% if error %}
                <p class="error-msg"> {{error}} </p>
                {% endif %}
                
                <form action="/login" method="POST" id="login">
                    <div>
                        <input type="text" name="email" placeholder="帳號 (Email)" required>
                    </div>
                    <div>
                        <input type="password" name="password" placeholder="密碼" required>
                    </div>
                    <div>
                        <input type="submit" value="立即登入" id="loginButton">
                    </div>
                    <a href="/registerationForm">還沒有帳號？點此註冊</a>
                </form>
            </div>
        </div>
    </div>
</div>

<footer id="footer">
    <p class="mb-0">&copy; 最終解釋權與所有權歸製作者所有</p>
</footer>

</body>
</html>
